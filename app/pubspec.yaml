name: crgs
description: "REX APP — Mobile app for sales executives"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  shadcn_ui: ^0.54.0
  iconsax_plus: ^1.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  lottie: ^3.3.3
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/routes/
    - assets/lottie/
